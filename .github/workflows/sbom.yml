# Free-tier CycloneDX SBOM via Syft (anchore/sbom-action)
# plus Grype vuln scan of that SBOM.
# Artifact only — do not commit generated SBOM / Grype blobs.
# No paid GHAS / Dependency Review / code-scanning SARIF upload.
# dependency-snapshot left false.
name: SBOM

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  release:
    types: [published]
  schedule:
    # Weekly: Monday 09:00 America/Chicago (14:00 UTC while CDT)
    - cron: "0 14 * * 1"

# PR runs share a per-PR group and supersede each other. Every other event
# (push, release, schedule, workflow_dispatch) gets a unique per-run group,
# so it can never be cancelled or replaced by a newer pending run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  sbom:
    runs-on: ubuntu-24.04
    # Caps hung steps once a runner picks the job up (observed ~1.5 min).
    # Does NOT bound time spent queued waiting for a runner.
    timeout-minutes: 15
    # Least privilege: generate, scan, and upload artifacts only.
    # Release-asset upload (contents: write) lives in the release-asset job.
    # No security-events: that would be GitHub code scanning (GHAS on private).
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Generate CycloneDX SBOM (Syft)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .
          format: cyclonedx-json
          output-file: sbom.cyclonedx.json
          # Pinned upload-artifact below owns the workflow artifact (fixed name).
          # This action must not attach a release asset from a pull request.
          upload-artifact: false
          upload-release-assets: false
          dependency-snapshot: false

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          # Fixed name, verified from schedule run 40389203649
          # (personal_groktor-sbom.cyclonedx.json). The zip entry stays
          # output-file (sbom.cyclonedx.json); release-asset checks that path.
          name: ${{ github.event.repository.name }}-sbom.cyclonedx.json
          path: sbom.cyclonedx.json
          retention-days: 30

      - name: Scan CycloneDX SBOM (Grype)
        id: grype
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          sbom: sbom.cyclonedx.json
          fail-build: false
          severity-cutoff: high
          output-format: json
          output-file: grype.json
          cache-db: true

      - name: Upload Grype report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: grype-report
          path: grype.json
          retention-days: 30

  verify-artifact:
    # Same download-artifact pin, name, and path as release-asset.
    # Runs on every event so the unpack contract is exercised without publishing.
    needs: sbom
    runs-on: ubuntu-24.04
    # Caps hung steps once a runner picks the job up.
    # Does NOT bound time spent queued waiting for a runner.
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Download SBOM artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ github.event.repository.name }}-sbom.cyclonedx.json
          path: .

      - name: Verify downloaded SBOM
        run: |
          test -f sbom.cyclonedx.json
          python3 - <<'PY'
          import json
          with open("sbom.cyclonedx.json") as f:
              doc = json.load(f)
          assert doc.get("bomFormat") == "CycloneDX", doc.get("bomFormat")
          print("ok: sbom.cyclonedx.json is CycloneDX")
          PY

  release-asset:
    # Only job with contents: write; runs only for published releases.
    # Download path (artifact name -> ./sbom.cyclonedx.json) is exercised by verify-artifact, including on PRs.
    if: github.event_name == 'release'
    needs: [sbom, verify-artifact]
    runs-on: ubuntu-24.04
    # Caps hung steps once a runner picks the job up (new job; expected <1 min).
    # Does NOT bound time spent queued waiting for a runner.
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download SBOM artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ github.event.repository.name }}-sbom.cyclonedx.json
          path: .

      - name: Upload SBOM to release
        env:
          GH_TOKEN: ${{ github.token }}
          # Passed via env (not inlined) to avoid script injection from tag names.
          TAG: ${{ github.event.release.tag_name }}
          # Zip entry is the output file. Check it exists; do not execute it.
          SBOM: sbom.cyclonedx.json
        run: |
          test -f "$SBOM"
          gh release upload "$TAG" "$SBOM" --clobber --repo "$GITHUB_REPOSITORY"
