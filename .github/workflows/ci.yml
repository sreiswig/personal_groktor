name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    # Caps hung steps once a runner picks the job up (observed ~1 min; headroom for cold cargo builds).
    # Does NOT bound time spent queued waiting for a runner.
    timeout-minutes: 20
    steps:
      # Vulnerable: floating actions/checkout@v7 can retarget under us.
      # Secure: immutable SHA matching sbom.yml (tag v7.0.1).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Vulnerable: dtolnay/rust-toolchain@stable floats to whatever
      # stable is current and ignores rust-toolchain.toml.
      # Secure: install the same explicit pin as rust-toolchain.toml
      # (1.98.1) plus rustfmt/clippy.
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: rustfmt, clippy
      - name: Toolchain
        run: rustc --version && rustfmt --version
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test --locked
