# Dependabot: Rust crates + GitHub Actions (weekly).
#
# Cargo.lock is committed, so cargo updates apply to the lockfile.
# Semver-major cargo version updates are ignored; a human decides MSRV
# and breaking bumps. Minor and patch cargo updates are grouped.
version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      cargo-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
